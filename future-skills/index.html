<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#32105a"><meta name="description" content="Discover your strengths and future-ready skills with Grow24Hub's free three-minute career discovery quiz."><title>Future Skills Discovery | Grow24Hub</title><link rel="canonical" href="https://grow24hub.com/future-skills/">
<style>
:root{font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;color:#29143f;background:#f5f0fb}*{box-sizing:border-box}body{margin:0;min-height:100dvh}button,a{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #b76dff;outline-offset:3px}.skip{position:absolute;left:-999px}.skip:focus{left:10px;top:10px;background:white;padding:10px;z-index:3}.top{padding:18px max(20px,calc((100vw - 850px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px;background:white;border-bottom:1px solid #e7daf1}.brand{font-weight:800;font-size:1.25rem;color:#58219a;text-decoration:none}.top a:last-child{color:#58219a}.shell{max-width:760px;margin:32px auto;padding:0 18px 50px}.panel{background:#fff;border:1px solid #e7daf1;border-radius:24px;box-shadow:0 14px 44px #3a125a12;padding:clamp(22px,5vw,46px)}.hero{background:radial-gradient(circle at 85% 5%,#8c42c9,transparent 40%),linear-gradient(135deg,#351052,#211033);color:white}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:.77rem;font-weight:800;color:#cda6ff}h1{font-size:clamp(2rem,6vw,3.2rem);line-height:1.13;margin:15px 0}h2{font-size:clamp(1.45rem,4vw,2rem);line-height:1.25}p{margin:12px 0}.muted{color:#665875}.hero .muted{color:#e8dafa}.button{display:inline-flex;justify-content:center;align-items:center;gap:8px;border:0;border-radius:13px;background:#7532c2;color:white;font-weight:750;padding:14px 20px;min-height:48px;text-decoration:none}.hero .button{background:white;color:#3c1762}.button.secondary{background:#f0e7f9;color:#512083}.button:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:25px}.progress{height:9px;background:#eee5f7;border-radius:12px;overflow:hidden;margin:16px 0 25px}.progress>div{height:100%;background:#8135c9;transition:width .2s}.choices{display:grid;gap:11px;margin-top:24px}.choice{display:block;text-align:left;width:100%;padding:16px;border:2px solid #e8dff0;border-radius:14px;background:white;color:#29143f;min-height:56px}.choice:hover{border-color:#9d62d5}.choice[aria-pressed=true]{border-color:#7532c2;background:#f3e9ff;font-weight:700}.small{font-size:.875rem}.tag{display:inline-block;background:#f1e7fb;color:#5c238f;border-radius:30px;padding:5px 12px;font-size:.83rem;font-weight:700}.section{border-top:1px solid #e7daf1;padding-top:18px;margin-top:20px}li{margin:8px 0}ul,ol{padding-left:22px}.resources a{color:#5b2198;overflow-wrap:anywhere}.footer{text-align:center;color:#665875;font-size:.85rem;padding:18px}.hidden{display:none!important}@media(max-width:500px){.shell{margin:18px auto}.top{padding:14px 18px}.panel{border-radius:18px}.actions .button{flex:1}}
</style></head><body>
<a class="skip" href="#main">Skip to quiz</a><header class="top"><a class="brand" href="/">✦ Grow24Hub</a><a href="/">Back to website</a></header><main id="main" class="shell"><div id="app" aria-live="polite"></div></main><footer class="footer">Grow24Hub • Careers · Digital Skills · AI & Technology<br>Independent educational guidance, not a validated assessment or employment guarantee.</footer>
<script>
"use strict";
const questions=[
{q:"Where are you in your career journey?",options:["Student or graduate","Starting my career","Experienced professional","Exploring a career change"],dimension:"stage"},
{q:"Which area best describes your experience?",options:["People, communication or education","Business, operations or administration","Technology, IT or engineering","I'm still exploring"],dimension:"background"},
{q:"How do you currently use AI tools?",options:["I haven't tried them yet","I've tried them a few times","I use them for everyday tasks","I regularly improve workflows with them"],dimension:"exposure",scores:[0,1,2,3]},
{q:"How confident are you with digital tools?",options:["I'm learning the basics","I can use common apps","I can solve many digital problems","I can teach others or build solutions"],dimension:"confidence",scores:[0,1,2,3]},
{q:"Which technology topic interests you most?",options:["AI tools and prompting","Automation and smarter workflows","Python, data and machine learning","Cybersecurity and digital safety"],dimension:"interest"},
{q:"What would you most like to achieve next?",options:["Feel more confident with technology","Work more effectively in my current role","Develop deeper technical skills","Move into a different career field"],dimension:"goal"},
{q:"How do you approach a new technology challenge?",options:["I prefer a simple guided example","I experiment with tutorials","I research and practise independently","I design a solution and test it"],dimension:"approach",scores:[0,1,2,3]},
{q:"How much time could you learn each week?",options:["Less than 1 hour","1–2 hours","3–5 hours","More than 5 hours"],dimension:"time"},
{q:"Where would you like your career to take you?",options:["Grow in my current location","Explore international opportunities","Work remotely or across borders","I'm open to different possibilities"],dimension:"mobility"}
];
const profiles={
explorer:{icon:"🌱",name:"AI Explorer",description:"You're discovering how digital tools can support your work and learning. Start small, experiment safely and build confidence.",strengths:["Curiosity about new possibilities","Willingness to explore","Experience and perspectives you can build on"],skills:["Everyday digital confidence","Responsible AI prompting","Checking AI outputs for accuracy"],plan:["Try one AI tool on a low-risk task","Practise three useful prompts and compare results","Learn basic privacy and AI safety habits","Write down five tasks where technology could help"],directions:["Digital support","Administrative technology roles","AI-enabled work in your existing field"],resources:[["Microsoft Learn: AI basics","https://learn.microsoft.com/training/"],["Google Applied Digital Skills","https://applieddigitalskills.withgoogle.com/"]]},
accelerator:{icon:"⚡",name:"Digital Accelerator",description:"You're ready to use technology more deliberately to improve everyday tasks and workflows.",strengths:["Practical problem-solving potential","Interest in improving processes","Existing workplace or study experience"],skills:["AI-assisted productivity","Spreadsheet and data basics","No-code workflow automation"],plan:["Choose one repetitive task to improve","Learn a spreadsheet or AI productivity feature","Create a small no-code workflow","Evaluate time saved and document your process"],directions:["Operations analyst","Digital coordinator","Workflow automation support"],resources:[["Microsoft Learn","https://learn.microsoft.com/training/"],["Google Skillshop","https://skillshop.withgoogle.com/"]]},
builder:{icon:"🧠",name:"AI Skills Builder",description:"You want to understand technical tools more deeply and develop hands-on skills through practice.",strengths:["Technical curiosity","Interest in structured problem-solving","Motivation to build practical projects"],skills:["Python fundamentals","Data analysis","Machine learning concepts"],plan:["Write your first small Python programs","Load and explore a sample dataset","Complete an introductory ML lesson","Publish a small learning project with clear notes"],directions:["Junior data analyst","Automation developer pathway","AI/ML pathway with further study"],resources:[["Official Python tutorial","https://docs.python.org/3/tutorial/"],["Kaggle Learn","https://www.kaggle.com/learn"]]},
ready:{icon:"🚀",name:"Future-Ready Professional",description:"You report confident digital habits and may be ready to apply them more strategically and responsibly.",strengths:["Digital confidence","Independent problem-solving","Potential to support others"],skills:["Workflow design and evaluation","AI governance and security","Communicating technology improvements"],plan:["Audit an existing workflow","Prototype an improvement with privacy safeguards","Measure quality and potential risks","Share a concise improvement proposal"],directions:["Digital transformation specialist","Technology project coordinator","AI adoption and governance support"],resources:[["Microsoft Learn: AI","https://learn.microsoft.com/training/"],["NIST AI Risk Management Framework","https://www.nist.gov/itl/ai-risk-management-framework"]]},
transformer:{icon:"💡",name:"AI Career Transformer",description:"You're considering a new direction. Your existing experience can help you choose a realistic pathway rather than starting from zero.",strengths:["Transferable professional experience","Motivation for change","A fresh perspective on technology"],skills:["Mapping transferable skills","Choosing a focused digital specialism","Building a demonstrable portfolio"],plan:["Choose two target career directions","Compare required skills with your experience","Complete one small relevant learning project","Update your CV or portfolio with evidence"],directions:["Business or data analyst pathway","Cybersecurity entry pathway","Digital operations or AI-enabled roles"],resources:[["Europass career and skills tools","https://europass.europa.eu/"],["Cisco Networking Academy","https://www.netacad.com/"]]}
};
const app=document.getElementById("app");let step=-1;const answers=Array(questions.length).fill(null);
function button(label,action,secondary=false){return '<button type="button" class="button'+(secondary?' secondary':'')+'" data-action="'+action+'">'+label+'</button>'}
function render(){if(step===-1){app.innerHTML='<section class="panel hero"><div class="eyebrow">Free • 9 questions • About 3 minutes</div><h1>Is Your Career Ready for the AI Era?</h1><p>Discover your strengths, explore future-ready skills and find your next learning step.</p><p class="muted">No sign-up. No personal details. Your answers stay in this browser session.</p><div class="actions">'+button("Discover my path →","start")+'</div></section>';return}
if(step<questions.length){const q=questions[step];app.innerHTML='<section class="panel"><div class="eyebrow">Question '+(step+1)+' of '+questions.length+'</div><div class="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="9" aria-valuenow="'+step+'"><div style="width:'+100*step/questions.length+'%"></div></div><h2 id="question" tabindex="-1">'+q.q+'</h2><div class="choices">'+q.options.map((o,i)=>'<button type="button" class="choice" data-choice="'+i+'" aria-pressed="'+(answers[step]===i)+'">'+String.fromCharCode(65+i)+'. '+o+'</button>').join("")+'</div><div class="actions">'+button("← Back","back",true)+button(step===8?"See my result →":"Next →","next")+'</div><p id="hint" class="small muted" role="status">Select the answer that fits you best.</p></section>';document.getElementById("question").focus();return}
showResult()}
function classify(){const a=answers;const exposure=a[2],confidence=a[3],approach=a[6],goal=a[5],interest=a[4];const points=exposure+confidence+approach; // Each score is 0–3.
if(goal===3)return "transformer"; // Explicit transition goal takes priority.
if(interest===2 && goal===2)return "builder"; // Technical intention takes priority over familiarity.
if(points<=3)return "explorer";
if(points>=7)return "ready";
if(interest===2 && points>=4)return "builder";
return "accelerator"}
function showResult(){const key=classify(),p=profiles[key],time=answers[7],pace=["10–15 minutes when possible","Two short sessions","Three focused sessions","Four or more focused sessions"][time];const mobility=answers[8];const extra=mobility===1?"Explore role requirements and language expectations in your target country.":mobility===2?"Look for remote-friendly skills and cross-border collaboration experience.":"Focus first on evidence of skills that matches your preferred opportunities.";app.innerHTML='<article class="panel"><span class="tag">Your discovery profile</span><h1>'+p.icon+' '+p.name+'</h1><p>'+p.description+'</p><div class="section"><h2>Your potential strengths</h2><ul>'+p.strengths.map(x=>'<li>'+x+'</li>').join("")+'</ul><p class="small muted">These are suggested strengths to reflect on, not verified abilities.</p></div><div class="section"><h2>Three skills to explore</h2><ol>'+p.skills.map(x=>'<li>'+x+'</li>').join("")+'</ol></div><div class="section"><h2>Your 30-day starter plan</h2><p class="muted">Suggested pace: '+pace+' per week. Adjust activities to your available time.</p><ol>'+p.plan.map((x,i)=>'<li><strong>Week '+(i+1)+':</strong> '+x+'</li>').join("")+'</ol></div><div class="section"><h2>Career directions to research</h2><ul>'+p.directions.map(x=>'<li>'+x+'</li>').join("")+'</ul><p>'+extra+'</p></div><div class="section resources"><h2>Learning resources</h2><ul>'+p.resources.map(r=>'<li><a href="'+r[1]+'" target="_blank" rel="noopener noreferrer">'+r[0]+' ↗</a></li>').join("")+'</ul><p class="small muted">Explore course content, prerequisites, costs and availability before enrolling.</p></div><div class="section"><h2>How this result was chosen</h2><p class="small">Your self-reported AI use, digital confidence and learning approach each contribute 0–3 points. A stated career-change goal selects Career Transformer; a technical-learning goal paired with Python/data interest selects AI Skills Builder. Otherwise, totals of 0–3 select AI Explorer and 7–9 select Future-Ready Professional; technical interest with 4–6 points selects AI Skills Builder, and other mid-range answers select Digital Accelerator. Learning time adjusts the plan and mobility adjusts career guidance. Profiles are directions, not ranks.</p></div><p class="small muted">Educational guidance only. This is not a scientifically validated assessment or a prediction of employment.</p><div class="actions">'+button("Copy my result","copy")+button("Start again","restart",true)+'</div><p id="copy-status" role="status" class="small muted"></p></article>'}
app.addEventListener("click",async e=>{const choice=e.target.closest("[data-choice]");if(choice){answers[step]=Number(choice.dataset.choice);render();return}const el=e.target.closest("[data-action]");if(!el)return;switch(el.dataset.action){case"start":step=0;break;case"back":step=Math.max(-1,step-1);break;case"next":if(answers[step]===null){document.getElementById("hint").textContent="Please choose one answer to continue.";return}step++;break;case"restart":answers.fill(null);step=-1;break;case"copy":{const p=profiles[classify()];const message="My Grow24Hub discovery profile: "+p.icon+" "+p.name+". I'm exploring "+p.skills[0]+". Find yours: https://grow24hub.com/future-skills/";try{await navigator.clipboard.writeText(message);document.getElementById("copy-status").textContent="Result text copied. You can paste it into LinkedIn."}catch{document.getElementById("copy-status").textContent="Copy unavailable in this browser. You can share your profile name and the Grow24Hub link manually."}return}}render()});render();
</script></body></html>
